<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
  </head>
  <body>
    <header>
      <p>Header</p>
      <a href="../index.html">Home</a>
    </header>
    <main>
      <section>
        <form>
          <div>
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" />
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" />
            <div></div>
            <label for="emailAddress">Email Address</label>
            <input type="email" id="emailAddress" name="emailAddress" />
          </div>
          <div>
            <button type="submit">Sign Me Up!</button>
          </div>
        </form>
        <hr>
      </section>
        <h3>Mega Survey</h3>
        <form>
            <p>How do you get to school?</p>
            <input type="radio" id="bus" name="transportation">
            <label for="bus">Bus</label>
            <input type="radio" id="car" name="transportation">
            <label for="car">Car</label>
            <input type="radio" id="walk" name="transportation">
            <label for="walk">Walk</label>
            
            <hr>
            <p>What are your favorite hobbies?</p>
            <input type="checkbox" id="gaming" name="hobbies">
            <label for="gaming">Gaming</label>
            <input type="checkbox" id="surfing" name="hobbies">
            <label for="surfing">Surfing</label>
            <input type="checkbox" id="running" name="hobbies">
            <label for="running">Running</label>
            <input type="checkbox" id="coding" name="hobbies">
            <label for="coding">Coding</label>
            
            <hr>
            <label for="additionalComments">Additional Comments</label>
            <textarea name="additionalComments" id="additionalComments" rows="4" cols="50"></textarea>
            <hr>
            <label for="grade">Grade</label>
            <select id="grade" name="grade">
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
        </form>
    </main>
  </body>
</html>
